<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="cryptoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5" />
      <stop offset="60%" stop-color="#FFE4EC" />
      <stop offset="100%" stop-color="#FED7E2" />
    </linearGradient>
    <linearGradient id="btcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="pinkShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E74" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <filter id="glowBtc" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#F59E0B" flood-opacity="0.3" />
    </filter>
    <filter id="cardGlow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#FF2E74" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#cryptoBg)" rx="24"/>

  <!-- Network grid lines -->
  <g stroke="#FBCFE8" stroke-width="1.5" stroke-dasharray="6,6">
    <line x1="200" y1="140" x2="400" y2="240" />
    <line x1="600" y1="140" x2="400" y2="240" />
    <line x1="200" y1="360" x2="400" y2="240" />
    <line x1="600" y1="360" x2="400" y2="240" />
  </g>

  <!-- Big Central Bitcoin & Halving Emblem -->
  <g transform="translate(400, 240)" filter="url(#glowBtc)">
    <circle cx="0" cy="0" r="82" fill="url(#btcGrad)" stroke="#FFFFFF" stroke-width="5" />
    <circle cx="0" cy="0" r="70" fill="none" stroke="#FEF3C7" stroke-width="2" stroke-dasharray="8,6" />
    <!-- Bitcoin 'B' icon -->
    <path d="M -16 -40 L -16 40 M -6 -44 L -6 -40 M 6 -44 L 6 -40 M -6 40 L -6 44 M 6 40 L 6 44 M -22 -32 L 6 -32 C 18 -32 24 -24 24 -16 C 24 -7 18 -2 6 -2 L -22 -2 M -22 -2 L 10 -2 C 24 -2 30 6 30 16 C 30 26 22 32 10 32 L -22 32" 
          stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Left Card: US Institutional Spot ETFs -->
  <g transform="translate(90, 110)" filter="url(#cardGlow2)">
    <rect width="215" height="135" rx="16" fill="#FFFFFF" stroke="#FEE2E8" stroke-width="2" />
    <text x="20" y="38" font-family="'Outfit', sans-serif" font-weight="bold" font-size="14" fill="#0F172A">🇺🇸 US Institutional ETFs</text>
    <text x="20" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#64748B">BlackRock, Fidelity &amp; SEC</text>
    <rect x="20" y="78" width="175" height="6" rx="3" fill="#FFF1F5" />
    <rect x="20" y="78" width="130" height="6" rx="3" fill="url(#pinkShieldGrad)" />
    <text x="20" y="112" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" fill="#FF2E74">$70B+ AUM Inflows</text>
  </g>

  <!-- Right Card: UK HMRC Tax & FCA Regime -->
  <g transform="translate(500, 260)" filter="url(#cardGlow2)">
    <rect width="215" height="135" rx="16" fill="#FFFFFF" stroke="#FEE2E8" stroke-width="2" />
    <text x="20" y="38" font-family="'Outfit', sans-serif" font-weight="bold" font-size="14" fill="#0F172A">🇬🇧 UK HMRC &amp; FCA</text>
    <text x="20" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#64748B">Capital Gains Tax &amp; Pooling</text>
    <rect x="20" y="78" width="175" height="6" rx="3" fill="#FFF1F5" />
    <rect x="20" y="78" width="110" height="6" rx="3" fill="#3B82F6" />
    <text x="20" y="112" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" fill="#2563EB">Section 104 Pool Rules</text>
  </g>

  <!-- Pill: Halving Cycle -->
  <g transform="translate(320, 365)" filter="url(#cardGlow2)">
    <rect width="160" height="38" rx="19" fill="#FFFFFF" stroke="#FEE2E8" stroke-width="1.5" />
    <circle cx="22" cy="19" r="6" fill="#10B981" />
    <text x="36" y="24" font-family="'Outfit', sans-serif" font-weight="bold" font-size="12" fill="#0F172A">Post-Halving Era</text>
  </g>
</svg>
