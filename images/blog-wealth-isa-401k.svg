<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5" />
      <stop offset="50%" stop-color="#FFE4EC" />
      <stop offset="100%" stop-color="#FFD6E3" />
    </linearGradient>
    <linearGradient id="pinkGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E74" />
      <stop offset="100%" stop-color="#FA709A" />
    </linearGradient>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>
    <filter id="softGlow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#FF2E74" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad1)" rx="24"/>
  <circle cx="700" cy="80" r="140" fill="#FF2E74" opacity="0.08" />
  <circle cx="100" cy="400" r="180" fill="#FA709A" opacity="0.1" />

  <!-- Grid lines -->
  <g stroke="#FFCCD8" stroke-width="1" stroke-dasharray="4,6">
    <line x1="80" y1="120" x2="720" y2="120" />
    <line x1="80" y1="200" x2="720" y2="200" />
    <line x1="80" y1="280" x2="720" y2="280" />
    <line x1="80" y1="360" x2="720" y2="360" />
  </g>

  <!-- Growth chart line and area -->
  <path d="M 120 380 Q 260 340 380 250 T 680 130 L 680 400 L 120 400 Z" fill="url(#pinkGrad1)" opacity="0.12" />
  <path d="M 120 380 Q 260 340 380 250 T 680 130" fill="none" stroke="url(#pinkGrad1)" stroke-width="5" stroke-linecap="round" />

  <!-- Data points on chart -->
  <circle cx="120" cy="380" r="7" fill="#FFFFFF" stroke="#FF2E74" stroke-width="4" />
  <circle cx="280" cy="320" r="7" fill="#FFFFFF" stroke="#FF2E74" stroke-width="4" />
  <circle cx="440" cy="225" r="7" fill="#FFFFFF" stroke="#FF2E74" stroke-width="4" />
  <circle cx="600" cy="165" r="7" fill="#FFFFFF" stroke="#FF2E74" stroke-width="4" />
  <circle cx="680" cy="130" r="9" fill="#FF2E74" stroke="#FFFFFF" stroke-width="4" filter="url(#softGlow1)" />

  <!-- Floating Cards (Transatlantic USA & UK) -->
  <!-- USA Card (401k & Roth IRA) -->
  <g transform="translate(130, 100)" filter="url(#softGlow1)">
    <rect width="210" height="135" rx="16" fill="#FFFFFF" stroke="#FEE2E8" stroke-width="2" />
    <rect x="18" y="18" width="34" height="24" rx="4" fill="#3B82F6" opacity="0.15" />
    <text x="35" y="34" font-family="'Outfit', sans-serif" font-weight="bold" font-size="12" fill="#2563EB" text-anchor="middle">🇺🇸 US</text>
    <text x="18" y="68" font-family="'Outfit', sans-serif" font-weight="bold" font-size="15" fill="#0F172A">401(k) &amp; Roth IRA</text>
    <text x="18" y="88" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#64748B">Annual Cap: $23,500+</text>
    <rect x="18" y="102" width="70" height="18" rx="9" fill="#10B981" opacity="0.15" />
    <text x="53" y="115" font-family="'Outfit', sans-serif" font-weight="bold" font-size="10" fill="#059669" text-anchor="middle">Tax-Sheltered</text>
  </g>

  <!-- UK Card (ISA & SIPP) -->
  <g transform="translate(460, 170)" filter="url(#softGlow1)">
    <rect width="210" height="135" rx="16" fill="#FFFFFF" stroke="#FEE2E8" stroke-width="2" />
    <rect x="18" y="18" width="34" height="24" rx="4" fill="#EF4444" opacity="0.15" />
    <text x="35" y="34" font-family="'Outfit', sans-serif" font-weight="bold" font-size="12" fill="#DC2626" text-anchor="middle">🇬🇧 UK</text>
    <text x="18" y="68" font-family="'Outfit', sans-serif" font-weight="bold" font-size="15" fill="#0F172A">Stocks &amp; Shares ISA</text>
    <text x="18" y="88" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#64748B">Annual Allowance: £20,000</text>
    <rect x="18" y="102" width="68" height="18" rx="9" fill="#FF2E74" opacity="0.15" />
    <text x="52" y="115" font-family="'Outfit', sans-serif" font-weight="bold" font-size="10" fill="#FF2E74" text-anchor="middle">100% Tax-Free</text>
  </g>

  <!-- Central Intersect Coin / Symbol -->
  <g transform="translate(390, 230)">
    <circle cx="10" cy="10" r="38" fill="url(#pinkGrad1)" filter="url(#softGlow1)" />
    <text x="10" y="17" font-family="'Outfit', sans-serif" font-weight="bold" font-size="22" fill="#FFFFFF" text-anchor="middle">⇄</text>
  </g>
</svg>
