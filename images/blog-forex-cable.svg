<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="fxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5" />
      <stop offset="50%" stop-color="#FEE2E8" />
      <stop offset="100%" stop-color="#FED7E2" />
    </linearGradient>
    <linearGradient id="fxPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E74" />
      <stop offset="100%" stop-color="#FA709A" />
    </linearGradient>
    <linearGradient id="fxBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="fxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#FF2E74" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#fxBg)" rx="24"/>

  <!-- Candlesticks in background -->
  <g opacity="0.35">
    <!-- Candle 1 Bullish -->
    <line x1="160" y1="180" x2="160" y2="340" stroke="#10B981" stroke-width="2" />
    <rect x="150" y="220" width="20" height="80" rx="3" fill="#10B981" />

    <!-- Candle 2 Bearish -->
    <line x1="220" y1="200" x2="220" y2="370" stroke="#EF4444" stroke-width="2" />
    <rect x="210" y="240" width="20" height="90" rx="3" fill="#EF4444" />

    <!-- Candle 3 Bullish -->
    <line x1="280" y1="140" x2="280" y2="320" stroke="#10B981" stroke-width="2" />
    <rect x="270" y="170" width="20" height="110" rx="3" fill="#10B981" />

    <!-- Candle 4 Bullish -->
    <line x1="520" y1="170" x2="520" y2="350" stroke="#10B981" stroke-width="2" />
    <rect x="510" y="200" width="20" height="90" rx="3" fill="#10B981" />

    <!-- Candle 5 Bearish -->
    <line x1="580" y1="150" x2="580" y2="310" stroke="#EF4444" stroke-width="2" />
    <rect x="570" y="180" width="20" height="80" rx="3" fill="#EF4444" />

    <!-- Candle 6 Bullish -->
    <line x1="640" y1="120" x2="640" y2="280" stroke="#10B981" stroke-width="2" />
    <rect x="630" y="140" width="20" height="100" rx="3" fill="#10B981" />
  </g>

  <!-- Central Currency Pair Orb: GBP / USD -->
  <g transform="translate(400, 240)" filter="url(#fxShadow)">
    <circle cx="0" cy="0" r="85" fill="#FFFFFF" stroke="#FEE2E8" stroke-width="4" />
    <circle cx="0" cy="0" r="75" fill="none" stroke="url(#fxPink)" stroke-width="3" stroke-dasharray="10,6" />
    <text x="-26" y="8" font-family="'Outfit', sans-serif" font-weight="800" font-size="34" fill="#DC2626">£</text>
    <text x="26" y="8" font-family="'Outfit', sans-serif" font-weight="800" font-size="34" fill="#2563EB">$</text>
    <line x1="-3" y1="-30" x2="3" y2="30" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
    <rect x="-56" y="36" width="112" height="24" rx="12" fill="url(#fxPink)" />
    <text x="0" y="52" font-family="'Outfit', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" text-anchor="middle">THE CABLE</text>
  </g>

  <!-- Central BoE vs Fed Balance Indicator -->
  <g transform="translate(100, 120)" filter="url(#fxShadow)">
    <rect width="210" height="125" rx="16" fill="#FFFFFF" stroke="#FEE2E8" stroke-width="2" />
    <text x="20" y="36" font-family="'Outfit', sans-serif" font-weight="bold" font-size="13" fill="#DC2626">🇬🇧 Bank of England</text>
    <text x="20" y="60" font-family="'Outfit', sans-serif" font-weight="bold" font-size="22" fill="#0F172A">4.75% Base</text>
    <text x="20" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748B">Inflation Targeting &amp; MPC</text>
    <rect x="20" y="96" width="90" height="16" rx="8" fill="#FEE2E2" />
    <text x="65" y="108" font-family="'Outfit', sans-serif" font-weight="bold" font-size="9" fill="#DC2626" text-anchor="middle">RATE CUT CYCLE</text>
  </g>

  <g transform="translate(490, 120)" filter="url(#fxShadow)">
    <rect width="210" height="125" rx="16" fill="#FFFFFF" stroke="#FEE2E8" stroke-width="2" />
    <text x="20" y="36" font-family="'Outfit', sans-serif" font-weight="bold" font-size="13" fill="#2563EB">🇺🇸 Federal Reserve</text>
    <text x="20" y="60" font-family="'Outfit', sans-serif" font-weight="bold" font-size="22" fill="#0F172A">4.50% Fed Funds</text>
    <text x="20" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748B">FOMC &amp; Dual Mandate</text>
    <rect x="20" y="96" width="90" height="16" rx="8" fill="#EFF6FF" />
    <text x="65" y="108" font-family="'Outfit', sans-serif" font-weight="bold" font-size="9" fill="#2563EB" text-anchor="middle">NEUTRAL STANCE</text>
  </g>
</svg>
